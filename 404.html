<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yönlendiriliyor…</title>
<style>
  /* matches the site's own background tokens so this instant's-worth of a hop doesn't
     flash stark white before index.html takes over */
  html,body{ margin:0;background:#d1d3d6; }
  html[data-theme="dark"],body[data-theme="dark"]{ background:#1a1820; }
</style>
<script>
  // GitHub Pages has no real routing — a direct load of a clean path like
  // "/nilay-cv-web/hakkimda" has no matching file, so it serves this file's content
  // (with a 404 status, which browsers still execute). Stash the intended path and
  // bounce back to index.html, which reads it from sessionStorage and restores the
  // clean URL + scrolls to the right section.
  if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  sessionStorage.setItem('cleanPathRedirect', location.pathname);
  var parts = location.pathname.split('/').filter(Boolean);
  var root = parts.length ? '/' + parts[0] + '/' : '/';
  location.replace(root);
</script>
</head>
<body></body>
</html>
